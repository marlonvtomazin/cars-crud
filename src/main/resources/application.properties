spring.application.name=cars-crud

# LOCALE
spring.web.locale-resolver=fixed
spring.web.locale=pt-BR

# DB Connection config -> Docker
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/cars_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=cars
# Weak password just for development
spring.datasource.password=cars

# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Springdoc Open APi & Swagger 3
springdoc.swagger-ui.path=/docs-carscrud.html
springdoc.api-docs.path=/docs-carscrud
